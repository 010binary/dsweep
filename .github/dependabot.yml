version: 2
updates:
  # Keep pinned action versions current; a stale checkout action is a
  # supply-chain liability.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: 'ci'

  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: 'chore'
