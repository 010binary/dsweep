name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Lets you build downloadable binaries on demand from the Actions tab,
  # on any branch, without tagging a release.
  workflow_dispatch:

# Least privilege: nothing here needs to write to the repo.
permissions:
  contents: read

# A new push to the same ref supersedes the previous run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Never let one platform's failure hide another's — for a filesystem
      # tool, the OS-specific failure is usually the interesting one.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        # Windows would otherwise default to PowerShell, which mangles
        # unquoted arguments like -coverprofile=coverage.out into two args.
        # bash ships on all three runners, so every OS runs the same command.
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          # go.mod is the single source of truth for the Go version.
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      # -shuffle=on catches tests that only pass in declaration order.
      - name: Test
        run: go test -race -shuffle=on -coverprofile=coverage.out ./...

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out
          if-no-files-found: error

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.1

  tidy:
    name: go mod tidy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # Fails if go.mod/go.sum are not what `go mod tidy` would produce.
      - name: Verify go.mod is tidy
        run: go mod tidy -diff

      - name: Verify dependencies
        run: go mod verify

  # Builds the real release artifacts without publishing them. This both
  # cross-compiles every target the 3-OS test matrix cannot reach and proves
  # .goreleaser.yaml still works — so a release config break surfaces here
  # rather than at tag time, in public.
  build:
    name: build (snapshot)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # GoReleaser derives the snapshot version from git describe.
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: goreleaser/goreleaser-action@v7
        with:
          version: '~> v2'
          args: release --snapshot --clean
        env:
          # Not used for publishing in snapshot mode; passed so GoReleaser
          # never has to guess. Read-only, per the workflow permissions above.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload binaries
        uses: actions/upload-artifact@v7
        with:
          name: dsweep-binaries
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
          if-no-files-found: error
          retention-days: 14

  vuln:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Scan for known vulnerabilities
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
